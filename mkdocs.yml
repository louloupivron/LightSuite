validation:
  links:
    not_found: ignore
    unrecognized_links: ignore
    anchors: ignore

site_name: LightSuite
site_description: Python pipeline for mouse lightsheet brain atlas registration
site_url: https://lightsuite.readthedocs.io/
repo_url: https://github.com/dimokaramanlis/LightSuite
repo_name: dimokaramanlis/LightSuite
edit_uri: edit/main/docs/

theme:
  name: material
  palette:
    primary: teal
    accent: purple
  features:
    - navigation.sections
    - navigation.expand
    
extra_css:
  - stylesheets/custom.css
  
