# Example brain lightsheet config (Approach 1 — desktop monolith).
# Copy and edit paths for your sample before running:
#   uv run lightsuite doctor -c examples/brain_lightsheet.yaml
#   uv run lightsuite brain validate-config -c examples/brain_lightsheet.yaml

sample:
  name: Julie
  source:
    format: tiff_stack
    path: /media/gbm/NVME2/ALICe-pipelines-data/JulieBuron/1X
    tiff_type: channelperfile
  scratch: /media/gbm/NVME2/lightsuite_scratch
  save_path: /media/gbm/NVME2/ALICe-pipelines-data/JulieBuron/registered_allen
  voxel_um: [6.55, 6.55, 5]

atlas:
  provider: allen
  resolution_um: 10
  atlas_dir: /home/gbm/ALICe-pipelines/LightSuite/atlas/allen_CCF3_10um/

registration:
  channel_primary: 1
  resolution_um: 20
  channel_secondary: null
  cloud_threshold: 3
  sample_cloud_subsample: 0.25
  bspline_spatial_scale_mm: 0.64
  augment_points: true
  control_point_weight: 0.2
  orientation: [-1, 3, 2] 
  bcpd_path: /home/gbm/ALICe-pipelines/LightSuite/softwares/bcpd-master/
  

detection:
  enabled: false
  backend: classical
  cell_diameter_um: 14
  thresholds: [0.5, 0.4]
  channel: null
  debug: false

compute:
  use_gpu: false
  workers: 8


import:
  write_csv: true
  annotations:
  - format: points_csv
    path: /media/gbm/NVME2/ALICe-pipelines-data/JulieBuron/SegmentationImports/converted/arivis_561_points.csv
    label: arivis_488_cells
  - format: mask_tiff
    path: /media/gbm/NVME2/ALICe-pipelines-data/JulieBuron/SegmentationImports/converted/arivis_561_mask.tif
    label: arivis_488_mask

export:
  save_registered_volume: true
  write_cells_csv: true
  registered_volume_format: tiff 
  write_pyramid: true


# Step 2 — count imported points per atlas region
analysis:
  write_tidy_csv: true       # also writes chanXX_region_stats.csv during export
  count_points: true         # required: bin *_atlas_coords.npz into regions
  point_labels:              # optional: restrict to Imaris only (recommended if you also import Arivis)
    - arivis_488_cells
    - imaris_488_cells