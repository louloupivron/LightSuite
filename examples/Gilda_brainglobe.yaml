# Gilda with BrainGlobe Atlas API (optional: uv sync --extra atlas).
# Downloads perens_lsfm_mouse_20um to ~/.brainglobe/ on first use.
# Re-run check-orientation after switching from manual NIfTIs — axis order differs.

sample:
  name: Gilda
  source:
    format: tiff_stack
    tiff_type: planeperfile
    channels:
      - /media/gbm/NVME2/ALICe-pipelines-data/Gilda/output/channel_488/RES(5690x5834x2052)
      - /media/gbm/NVME2/ALICe-pipelines-data/Gilda/output/channel_647/RES(5690x5834x2052)
  scratch: /media/gbm/NVME2/lightsuite_scratch
  save_path: /media/gbm/NVME2/ALICe-pipelines-data/Gilda/output/registered_princeton

  voxel_um: [2.03, 2.03, 3]

atlas:
  provider: princeton
  source: brainglobe
  # brainglobe_name: princeton_mouse_20um  # inferred from provider + resolution_um
  resolution_um: 20

registration:
  channel_primary: 1
  channel_secondary: 2
  dual_channel_mi_weight_autofluor: 0.5
  dual_channel_mi_weight_signal: 0.5
  resolution_um: 20
  cloud_threshold: 3
  sample_cloud_subsample: 0.25
  bspline_spatial_scale_mm: 0.64
  augment_points: true
  control_point_weight: 0.2
  orientation: [1, -3, 2]
  bcpd_path: /home/gbm/ALICe-pipelines/LightSuite/softwares/bcpd-master/

detection:
  enabled: false
  backend: classical
  cell_diameter_um: 14
  thresholds: [0.5, 0.4]
  channel: null
  debug: false

compute:
  use_gpu: false
  workers: 8

export:
  save_registered_volume: true
  write_cells_csv: true
  registered_volume_format: tiff
  write_pyramid: true
