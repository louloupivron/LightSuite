# Canonical brain lightsheet template (copy before editing).
#
#   cp examples/brain_lightsheet.yaml my_mouse.yaml
#   uv run lightsuite doctor -c my_mouse.yaml
#   uv run lightsuite brain validate-config -c my_mouse.yaml
#
# See examples/README.md for workflow index and real sample configs.

sample:
  name: example_mouse
  source:
    format: tiff_stack
    path: /path/to/stitched/tiff/folder
    tiff_type: channelperfile
    # Multi-channel Terastitcher (one folder per channel):
    # tiff_type: planeperfile
    # channels:
    #   - /path/to/Ch1
    #   - /path/to/Ch2
  scratch: /path/to/fast_scratch
  save_path: /path/to/results/example_mouse
  voxel_um: [5.26, 5.26, 5.0]

atlas:
  provider: allen
  resolution_um: 10
  atlas_dir: /path/to/allen_ccf_10um

registration:
  resolution_um: 20
  channel_primary: 1
  channel_secondary: 2
  bspline_spatial_scale_mm: 0.64
  control_point_weight: 0.2

detection:
  enabled: false
  backend: classical
  cell_diameter_um: 14
  thresholds: [0.5, 0.4]
  channel: null
  debug: false

compute:
  workers: 4

export:
  registered_volume_format: tiff
  write_pyramid: false

# Optional: import native sample-space annotations after register (see docs/annotation_import.md)
# import:
#   write_csv: true
#   annotations:
#     - format: points_csv
#       path: /path/to/cells.csv
#       label: cells
#     - format: mask_tiff
#       path: /path/to/mask.tif
#       label: region_mask
