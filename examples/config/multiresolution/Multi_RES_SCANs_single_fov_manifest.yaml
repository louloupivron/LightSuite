# SmartSPIM 1.6× overview ↔ 9× single-FOV ROI — Multi_RES_SCANs
#
# Prerequisite: publish the pair manifests (once, rebuilds all three Multi_RES_SCANs pairs):
#   uv run python scripts/rebuild_multi_res_manifests.py
#
# Hybrid workflow (metadata overlap crops in match-points + manual landmarks):
#   uv sync --extra gui --extra registration
#   uv run lightsuite multires match-points   -c examples/config/multiresolution/Multi_RES_SCANs_single_fov_manifest.yaml
#   uv run lightsuite multires check-geometry -c examples/config/multiresolution/Multi_RES_SCANs_single_fov_manifest.yaml
#   uv run lightsuite multires register       -c examples/config/multiresolution/Multi_RES_SCANs_single_fov_manifest.yaml
#
# Automatic metadata-only mode: set geometry_mode: metadata below.

sample:
  name: Multi_RES_SCANs
  save_path: /media/gbm/NVME2/ALICe-pipelines-data/Multi_RES_SCANs/registration_results
  scratch: /media/gbm/NVME2/lightsuite_scratch

multires:
  pair_manifest: /media/gbm/NVME2/ALICe-pipelines-data/Multi_RES_SCANs/registration_results/converted/single_fov_561_pair.json

  geometry_mode: hybrid
  landmarks:
    # Keep the existing single-FOV session (pre-pair-label default path).
    session_path: /media/gbm/NVME2/ALICe-pipelines-data/Multi_RES_SCANs/registration_results/multires_landmarks.json
    fit_mode: similarity     # similarity | rigid | affine
    min_pairs: 3

  registration:
    overlap_margin_um: 0.0
    registration_bin: 2
    experiment_name: single_fov_561_hybrid
    elastix_stages: [translation, rigid]
    write_full_overview_canvas: false
