# mesoSPIM 1× overview ↔ 3.2× ROI — Julie Buron sample (561 nm)
#
#   uv sync --extra registration --extra gui
#   uv run lightsuite multires validate-config    -c examples/config/multiresolution/JulieBuron_multires.yaml
#   uv run lightsuite multires inspect-geometry   -c examples/config/multiresolution/JulieBuron_multires.yaml
#   uv run lightsuite multires check-geometry    -c examples/config/multiresolution/JulieBuron_multires.yaml
#   uv run lightsuite multires register          -c examples/config/multiresolution/JulieBuron_multires.yaml
#
# Pair manifest is rebuilt from multires.channels on validate / register.
# Legacy lightsuite mesospim path: see git history for JulieBuron_multires.yaml (pre-2026).

sample:
  name: JulieBuron
  save_path: /media/gbm/NVME2/ALICe-pipelines-data/JulieBuron/multiresolution_results
  scratch: /media/gbm/NVME2/lightsuite_scratch

multires:
  pair_label: baseline_561_TC
  pair_manifest: /media/gbm/NVME2/ALICe-pipelines-data/JulieBuron/multiresolution_results/converted/baseline_561_TC_pair.json

  channels:
    "561":
      overview: /media/gbm/NVME2/ALICe-pipelines-data/JulieBuron/1X/1-561-1x.tif
      roi: /media/gbm/NVME2/ALICe-pipelines-data/JulieBuron/3.2X/1-561-3.2x_TC.tif

  geometry_mode: metadata

  # Reference mesoSPIM convention for this dataset (default MesospimGeometryConfig).
  mesospim_geometry:
    overview:
      lateral_flip: [1, -1]
    roi:
      lateral_flip: [1, -1]

  registration:
    overlap_margin_um: 0.0
    registration_bin: 1     # use 2 for a faster smoke test
    experiment_name: baseline_561_TC
    elastix_stages: [translation, rigid]
    write_full_overview_canvas: true
    reference_channel: "561"
