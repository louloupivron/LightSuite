# Multiresolution registration — Marianna CMU mesoSPIM (0.8× overview ↔ 2.5× ROI)
#
#   uv sync --extra registration --extra gui
#   uv run lightsuite multires validate-config    -c examples/config/multiresolution/marianna_multires.yaml
#   uv run lightsuite multires inspect-geometry   -c examples/config/multiresolution/marianna_multires.yaml
#     (toggle Flip X/Y in Napari, then "Apply to YAML"; or --headless --write-config)
#   uv run lightsuite multires match-points        -c examples/config/multiresolution/marianna_multires.yaml
#   uv run lightsuite multires check-geometry    -c examples/config/multiresolution/marianna_multires.yaml
#   uv run lightsuite multires register          -c examples/config/multiresolution/marianna_multires.yaml
#
# Atlas registration: examples/config/mesoSPIM/marianna_yosi_parity.yaml (Perens, register_Yosi_test_python).

sample:
  name: Marianna
  save_path: /media/gbm/NVME2/ALICe-pipelines-data/Marianna_CMU/multiresolution_results
  scratch: /media/gbm/NVME2/lightsuite_scratch

multires:
  pair_label: u87_488_561
  pair_manifest: /media/gbm/NVME2/ALICe-pipelines-data/Marianna_CMU/multiresolution_results/converted/u87_488_561_pair.json

  channels:
    "488":
      overview: /media/gbm/NVME2/ALICe-pipelines-data/Marianna_CMU/0.8X/U87_DJ_1week_488_GFP_0.8x.tif
      roi: /media/gbm/NVME2/ALICe-pipelines-data/Marianna_CMU/2.5X/U87_DJ_1week_488_GFP_2.5x.tif
    "561":
      overview: /media/gbm/NVME2/ALICe-pipelines-data/Marianna_CMU/0.8X/U87_DJ_1week_561_RFP_0.8x.tif
      roi: /media/gbm/NVME2/ALICe-pipelines-data/Marianna_CMU/2.5X/U87_DJ_1week_561_RFP_2.5x.tif

  geometry_mode: hybrid
  landmarks:
    session_path: null   # default: save_path/multires_landmarks_u87_488_561.json
    fit_mode: similarity # similarity | rigid | affine (try affine if scale still drifts)
    min_pairs: 4

  # JulieBuron uses [1, -1] on both stacks. Marianna needs [-1, 1] on both
  # (same signs on overview and ROI — required for sitk resampling).
  mesospim_geometry:
    overview:
      lateral_flip: [-1, 1]
    roi:
      lateral_flip: [-1, 1]

  registration:
    overlap_margin_um: 0.0
    registration_bin: 1
    experiment_name: u87_488_561
    elastix_stages: [translation, rigid]
    # Canvas output is ~11.7 GB per channel on the 0.8x grid; keep off unless disk allows.
    write_full_overview_canvas: false
    reference_channel: "488"
    apply_transform_to: ["561"]
