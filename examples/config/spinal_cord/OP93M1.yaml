# Developer sample — machine-specific paths. Template: examples/spinal_cord.yaml
#   uv run lightsuite doctor -c examples/spinal_cord.yaml

sample:
  name: example_spinal_cord
  source:
    format: tiff_stack
    # Single-channel (omit channels and set path):
    # path: /media/gbm/NVME2/ALICe-pipelines-data/spinal_cord/OP93M1/Ex_561_Em_561F_Ch2_stitched
    # Multi-channel Terastitcher (one folder per channel) — same as brain:
    tiff_type: planeperfile
    channels:
      - /media/gbm/NVME2/ALICe-pipelines-data/spinal_cord/OP93M1/Ex_488_Em_488F_Ch1_stitched
      - /media/gbm/NVME2/ALICe-pipelines-data/spinal_cord/OP93M1/Ex_561_Em_561F_Ch2_stitched
    # auto: detect plane-per-file (Terastitcher) vs channel-per-file (default for single path)
    # planeperfile: one 2D TIFF per Z slice (large datasets)
    # channelperfile: one multi-page TIFF per channel
    # multichannel_single: single stack with interleaved channels (Bioformats layout)
    # skip_corrupt_slices: true  # optional: drop unreadable plane TIFFs
  scratch: /media/gbm/NVME2/lightsuite_scratch
  save_path: /media/gbm/NVME2/ALICe-pipelines-data/spinal_cord/OP93M1/registered
  # Native microscope voxel size in µm (NOT the registration grid).
  voxel_um: [1.8, 1.8, 1.8]

atlas:
  atlas_dir: /home/gbm/ALICe-pipelines/LightSuite/atlas/SC_P56_Atlas_10x10x20_v5_2020

registration:
  resolution_um: 20
  channel_primary: 2
  # Optional: skip GUI and set orientation in YAML instead of cord_orientation.txt
  # longitudinal_direction: caudorostral  # or rostrocaudal
  control_point_weight: 0.2
  straightening_lambda_pos: 5000
  straightening_lambda_ang: 5000

compute:
  workers: 4

# Optional: import native sample-space annotations after register (see docs/annotation_import.md)
# import:
#   write_csv: true
#   annotations:
#     - format: points_csv
#       path: /path/to/imaris_TAyellow_points.csv
#       label: imaris_TAyellow
#     - format: points_csv
#       path: /path/to/imaris_MG_cyan_points.csv
#       label: imaris_MG_cyan

# Step 2 — count imported points per Fiederling region and segment
