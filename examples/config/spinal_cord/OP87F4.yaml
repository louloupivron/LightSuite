# OP87F4 — SMART lightsheet spinal cord (3 channels, 1.8 µm native)
#
#   uv run lightsuite doctor                        -c examples/config/spinal_cord/OP87F4.yaml
#   uv run lightsuite spinal validate-config        -c examples/config/spinal_cord/OP87F4.yaml
#   uv run lightsuite gui                           -c examples/config/spinal_cord/OP87F4.yaml
#   uv run lightsuite spinal run                    -c examples/config/spinal_cord/OP87F4.yaml --resume
#
# Channel folders (plane-per-file TIFFs):
#   Ch0 = 488 nm autofluorescence
#   Ch1 = 561 nm
#   Ch2 = 640 nm
#
# Orientation was set previously (caudorostral) in registered/cord_orientation.txt.

sample:
  name: OP87F4
  source:
    format: tiff_stack
    tiff_type: planeperfile
    channels:
      - /media/gbm/NVME2/ALICe-pipelines-data/spinal_cord/OP87F4/All_Channels/Ch0
      - /media/gbm/NVME2/ALICe-pipelines-data/spinal_cord/OP87F4/All_Channels/Ch1
      - /media/gbm/NVME2/ALICe-pipelines-data/spinal_cord/OP87F4/All_Channels/Ch2
    # Ch0 has a few extra Z planes vs Ch1/Ch2; enable if preprocess complains:
    # skip_corrupt_slices: true
  scratch: /media/gbm/NVME2/lightsuite_scratch
  save_path: /media/gbm/NVME2/ALICe-pipelines-data/spinal_cord/OP87F4/registered
  voxel_um: [1.8, 1.8, 1.8]

atlas:
  atlas_dir: /home/gbm/ALICe-pipelines/LightSuite/atlas/SC_P56_Atlas_10x10x20_v5_2020

registration:
  channel_primary: 1
  resolution_um: 20
  longitudinal_direction: caudorostral
  control_point_weight: 0.5
  straightening_lambda_pos: 5000
  straightening_lambda_ang: 5000

compute:
  workers: 4

