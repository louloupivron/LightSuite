# Example spinal cord lightsheet config (Fiederling et al. 2021 atlas).
# Copy and edit paths before running:
#   uv run lightsuite doctor -c examples/spinal_cord.yaml
#   uv run lightsuite spinal validate-config -c examples/spinal_cord.yaml
#
# Download atlas from https://data.mendeley.com/datasets/4rrggzv5d5/1
# and set atlas.atlas_dir to the folder containing Segments.csv.

sample:
  name: example_spinal_cord
  source:
    format: tiff_stack
    # Single-channel (omit channels and set path):
    # path: /media/gbm/NVME2/ALICe-pipelines-data/spinal_cord/OP93M1/Ex_561_Em_561F_Ch2_stitched
    # Multi-channel Terastitcher (one folder per channel) — same as brain:
    tiff_type: planeperfile
    channels:
      - /media/gbm/NVME2/ALICe-pipelines-data/spinal_cord/OP87F4/All_Channels/Ch1
    # auto: detect plane-per-file (Terastitcher) vs channel-per-file (default for single path)
    # planeperfile: one 2D TIFF per Z slice (large datasets)
    # channelperfile: one multi-page TIFF per channel
    # multichannel_single: single stack with interleaved channels (Bioformats layout)
    # skip_corrupt_slices: true  # optional: drop unreadable plane TIFFs
  scratch: /media/gbm/NVME2/lightsuite_scratch
  save_path: /media/gbm/NVME2/ALICe-pipelines-data/spinal_cord/OP87F4/registered
  # Native microscope voxel size in µm (NOT the registration grid).
  voxel_um: [1.8, 1.8, 1.8]

atlas:
  atlas_dir: /home/gbm/ALICe-pipelines/LightSuite/atlas/SC_P56_Atlas_10x10x20_v5_2020

registration:
  resolution_um: 20
  channel_primary: 2
  # Optional: skip GUI and set orientation in YAML instead of cord_orientation.txt
  # longitudinal_direction: caudorostral  # or rostrocaudal
  control_point_weight: 0.2
  straightening_lambda_pos: 5000
  straightening_lambda_ang: 5000

compute:
  workers: 4

import:
  write_csv: true
  annotations:
    - format: points_csv
      path: /media/gbm/NVME2/ALICe-pipelines-data/spinal_cord/OP87F4/annotations/imaris_Coloc_pink_yellow_points.csv
      label: imaris_Coloc_pink_yellow
    - format: points_csv
      path: /media/gbm/NVME2/ALICe-pipelines-data/spinal_cord/OP87F4/annotations/imaris_coloc_cyan_pink_points.csv
      label: imaris_coloc_cyan_pink
    - format: points_csv
      path: /media/gbm/NVME2/ALICe-pipelines-data/spinal_cord/OP87F4/annotations/imaris_Coloc_cyan_yellow_points.csv
      label: imaris_Coloc_cyan_yellow

analysis:
  parcellate_intensities: true
  intensity_channels: [1]
  rollups: [division, structure, horn]
  split_hemispheres: true
  count_points: true
  point_labels:
    - imaris_Coloc_pink_yellow
    - imaris_coloc_cyan_pink
    - imaris_Coloc_cyan_yellow

