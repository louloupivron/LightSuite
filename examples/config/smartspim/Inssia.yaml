# Example brain lightsheet config (Approach 1 — desktop monolith).
# Copy and edit paths for your sample before running:
#   uv run lightsuite doctor -c examples/brain_lightsheet.yaml
#   uv run lightsuite brain validate-config -c examples/brain_lightsheet.yaml

sample:
  name: Inssia
  source:
    format: tiff_stack
    path: /media/gbm/NVME2/ALICe-pipelines-data/Inssia/49H/All_Channels/Ch1
    tiff_type: planeperfile
  scratch: /media/gbm/NVME2/lightsuite_scratch
  save_path: /media/gbm/NVME2/ALICe-pipelines-data/Inssia/49H/registration_Ch1_cropped
  voxel_um: [1.8, 1.8, 4]

atlas:
  provider: perens
  resolution_um: 20
  atlas_dir: /home/gbm/ALICe-pipelines/LightSuite/atlas/perens_20um/

registration:
  channel_primary: 1
  resolution_um: 20
  channel_secondary: null
  cloud_threshold: 3
  sample_cloud_subsample: 0.25
  bspline_spatial_scale_mm: 0.64
  augment_points: false
  control_point_weight: 0.2
  orientation: [2, 1, -3]
  bcpd_path: /home/gbm/ALICe-pipelines/LightSuite/softwares/bcpd-master/
  

detection:
  enabled: false
  backend: classical
  cell_diameter_um: 14
  thresholds: [0.5, 0.4]
  channel: null
  debug: false

compute:
  use_gpu: false
  workers: 8

export:
  save_registered_volume: false
  write_cells_csv: false
  registered_volume_format: tiff 
  write_pyramid: true
