# Example brain lightsheet config (Approach 1 — desktop monolith).
# Copy and edit paths for your sample before running:
#   uv run lightsuite doctor -c examples/brain_lightsheet.yaml
#   uv run lightsuite brain validate-config -c examples/brain_lightsheet.yaml

sample:
  name: Gilda
  source:
    format: tiff_stack
    path: /media/gbm/NVME2/ALICe-pipelines-data/Gilda
    tiff_type: channelperfile
  scratch: /media/gbm/NVME2/lightsuite_scratch
  save_path: /media/gbm/NVME2/ALICe-pipelines-data/Gilda/registered_allen_2
  voxel_um: [6.55, 6.55, 5]

atlas:
  provider: allen
  source: brainglobe
  resolution_um: 10 
  atlas_dir: /home/gbm/ALICe-pipelines/LightSuite/atlas/allen_CCF3_10um

registration:
  channel_primary: 1
  channel_secondary: 2
  dual_channel_mi_weight_autofluor: 0.3
  dual_channel_mi_weight_signal: 0.7
  resolution_um: 20
  bspline_spatial_scale_mm: 0.64
  augment_points: false
  control_point_weight: 0.2
  orientation: [1, 3, 2]
  bcpd_path: /home/gbm/ALICe-pipelines/LightSuite/softwares/bcpd-master/
  

detection:
  enabled: false
  backend: classical
  cell_diameter_um: 14
  thresholds: [0.5, 0.4]
  channel: null
  debug: false

compute:
  use_gpu: false
  workers: 8

export:
  save_registered_volume: true
  write_cells_csv: true
  registered_volume_format: tiff 
  write_pyramid: true
