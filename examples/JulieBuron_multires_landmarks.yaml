# mesoSPIM 1× overview ↔ 3.2× ROI — Julie Buron (landmark / hybrid placement)
# Uses mesoSPIM metadata for spacing and landmarks to refine ROI crop in the overview.
#
#   uv sync --extra registration
#   uv run lightsuite mesospim validate-config -c examples/mesospim_landmarks.yaml
#   uv sync --extra gui
#   uv run lightsuite mesospim match-points         -c examples/mesospim_landmarks.yaml
#   uv run lightsuite mesospim check-geometry      -c examples/mesospim_landmarks.yaml
#   uv run lightsuite mesospim register            -c examples/mesospim_landmarks.yaml
#   uv run lightsuite mesospim inspect             -c examples/mesospim_landmarks.yaml

sample:
  name: JulieBuron
  save_path: /media/gbm/NVME2/ALICe-pipelines-data/JulieBuron/multiresolution_results
  scratch: /media/gbm/NVME2/lightsuite_scratch

mesospim:
  geometry_mode: hybrid

  overview:
    path: /media/gbm/NVME2/ALICe-pipelines-data/JulieBuron/1X/1-561-1x.tif

  roi:
    path: /media/gbm/NVME2/ALICe-pipelines-data/JulieBuron/3.2X/1-561-3.2x_TC.tif

  geometry:
    stage_xy_is_center: true
    itk_lateral_dim0_motor: x
    lateral_flip: [1, -1]

  landmarks:
    session_path: null          # default: save_path/mesospim_landmarks.json
    fit_mode: similarity        # similarity | rigid | affine
    min_pairs: 3

  tiff_remap:
    reverse_z: false
    rot90_k_overview: 0
    rot90_k_roi: 0          # try 1 or 3 if slices are rotated 90°
    flip_row: false
    flip_col: false
    swap_xy: false
    extra_flip_row_roi: false   # toggle if ROI is mirrored vs overview

  registration:
    overlap_margin_um: 0.0
    registration_bin: 1     # use 2 for a faster smoke test
    experiment_name: baseline_561_TC_landmarks
    elastix_stages: [translation, rigid]
    write_full_overview_canvas: true
